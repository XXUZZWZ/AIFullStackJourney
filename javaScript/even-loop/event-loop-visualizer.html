<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 事件循环可视化演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .visualization-area {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .thread-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .main-thread {
            grid-column: span 2;
        }

        .queue-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #e9ecef;
            min-height: 150px;
        }

        .queue-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #495057;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
        }

        .call-stack .queue-title {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
        }

        .microtask-queue .queue-title {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            color: white;
        }

        .macrotask-queue .queue-title {
            background: linear-gradient(135deg, #45b7d1, #96c93d);
            color: white;
        }

        .event-queue .queue-title {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .render-queue .queue-title {
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            color: #333;
        }

        .other-threads .queue-title {
            background: linear-gradient(135deg, #c471ed, #f64f59);
            color: white;
        }

        .queue-items {
            min-height: 100px;
            background: white;
            border-radius: 6px;
            padding: 10px;
            border: 1px dashed #dee2e6;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .queue-items.receiving-task {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }

        .queue-items.sending-task {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
        }

        .task-item {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            transform: translateX(0);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform, opacity;
        }

        .task-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        .task-item.executing {
            animation: executeGlow 1.5s infinite;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.7);
            transform: scale(1.02);
        }

        .task-item.moving {
            animation: taskMove 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
        }

        .task-item.fade-out {
            animation: fadeOut 0.5s ease-in-out forwards;
        }

        .task-item.slide-in {
            animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-30px) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes executeGlow {
            0%, 100% { 
                transform: scale(1.02);
                box-shadow: 0 0 20px rgba(102, 126, 234, 0.7);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(102, 126, 234, 0.9);
            }
        }

        @keyframes taskMove {
            0% {
                transform: translateX(0) scale(1);
            }
            25% {
                transform: translateX(20px) scale(1.1);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
            }
            75% {
                transform: translateX(-10px) scale(1.05);
            }
            100% {
                transform: translateX(0) scale(1);
            }
        }

        @keyframes fadeOut {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(0.8);
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .control-section {
            margin-bottom: 20px;
        }

        .control-section h3 {
            margin-bottom: 10px;
            color: #495057;
            font-size: 1.1rem;
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f, #a8e6cf);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status-display {
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            font-size: 1.5rem;
            color: #6c757d;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .queue-container.highlight {
            animation: queueHighlight 0.5s ease-in-out;
        }

        @keyframes queueHighlight {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(102, 126, 234, 0);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
            }
        }

        .transfer-animation {
            position: absolute;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
        }

        .transfer-animation.active {
            animation: transferTask 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes transferTask {
            0% {
                opacity: 1;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
            }
            100% {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        .thread-transfer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .thread-box {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .thread-box.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            animation: threadActive 2s infinite;
            transform: scale(1.02);
        }

        .thread-box.processing {
            animation: threadProcessing 1s ease-in-out infinite;
        }

        .thread-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .thread-box.active::before {
            opacity: 1;
            animation: threadGlow 2s infinite;
        }

        @keyframes threadGlow {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.05) rotate(180deg);
            }
        }

        @keyframes threadActive {
            0%, 100% { 
                box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
                border-color: #667eea;
            }
            50% { 
                box-shadow: 0 0 25px rgba(102, 126, 234, 0.8);
                border-color: #4c51bf;
            }
        }

        @keyframes threadProcessing {
            0%, 100% {
                transform: scale(1.02);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .thread-box h4 {
            margin-bottom: 10px;
            color: #495057;
        }

        .code-example {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .code-example h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .code-block {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            margin-bottom: 10px;
        }

        .highlight {
            background: rgba(255, 255, 0, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .thread-section {
                grid-template-columns: 1fr;
            }
            
            .thread-transfer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JavaScript 事件循环可视化演示</h1>
            <p>深入理解浏览器中的任务调度机制</p>
        </div>

        <div class="main-content">
            <div class="visualization-area">
                <!-- 主线程区域 -->
                <div class="thread-section">
                    <div class="queue-container call-stack main-thread">
                        <div class="queue-title">执行栈 (Call Stack)</div>
                        <div class="queue-items" id="call-stack">
                            <!-- 执行栈项目将在这里显示 -->
                        </div>
                    </div>
                </div>

                <!-- 其他线程区域 -->
                <div class="thread-transfer">
                    <div class="thread-box" id="timer-thread">
                        <h4>计时器线程</h4>
                        <div class="queue-items" style="min-height: 60px;">
                            <div id="timer-tasks"></div>
                        </div>
                    </div>
                    <div class="thread-box" id="network-thread">
                        <h4>网络线程</h4>
                        <div class="queue-items" style="min-height: 60px;">
                            <div id="network-tasks"></div>
                        </div>
                    </div>
                    <div class="thread-box" id="event-thread">
                        <h4>事件线程</h4>
                        <div class="queue-items" style="min-height: 60px;">
                            <div id="event-tasks"></div>
                        </div>
                    </div>
                </div>

                <div class="arrow">⬇️ 任务完成后进入队列</div>

                <!-- 任务队列区域 -->
                <div class="thread-section">
                    <div class="queue-container microtask-queue">
                        <div class="queue-title">微任务队列 (Microtask Queue)</div>
                        <div class="queue-items" id="microtask-queue">
                            <!-- 微任务项目将在这里显示 -->
                        </div>
                    </div>
                    <div class="queue-container macrotask-queue">
                        <div class="queue-title">宏任务队列 (Macrotask Queue)</div>
                        <div class="queue-items" id="macrotask-queue">
                            <!-- 宏任务项目将在这里显示 -->
                        </div>
                    </div>
                    <div class="queue-container event-queue">
                        <div class="queue-title">事件队列 (Event Queue)</div>
                        <div class="queue-items" id="event-queue">
                            <!-- 事件队列项目将在这里显示 -->
                        </div>
                    </div>
                    <div class="queue-container render-queue">
                        <div class="queue-title">渲染任务队列 (Render Queue)</div>
                        <div class="queue-items" id="render-queue">
                            <!-- 渲染任务项目将在这里显示 -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="control-section">
                    <h3>基础示例</h3>
                    <button class="btn btn-primary" onclick="addSyncTask()">同步任务</button>
                    <button class="btn btn-secondary" onclick="addPromise()">Promise.then</button>
                    <button class="btn btn-success" onclick="addTimeout()">setTimeout</button>
                    <button class="btn btn-warning" onclick="addFetch()">Fetch 请求</button>
                </div>

                <div class="control-section">
                    <h3>复杂示例</h3>
                    <button class="btn btn-primary" onclick="runComplexExample()">综合示例</button>
                    <button class="btn btn-secondary" onclick="runNestedPromises()">嵌套 Promise</button>
                    <button class="btn btn-success" onclick="runMixedTasks()">混合任务</button>
                </div>

                <div class="control-section">
                    <h3>控制</h3>
                    <button class="btn btn-success" onclick="startExecution()">开始执行</button>
                    <button class="btn btn-warning" onclick="pauseExecution()">暂停</button>
                    <button class="btn btn-secondary" onclick="clearAll()">清空所有</button>
                </div>

                <div class="control-section">
                    <h3>执行状态</h3>
                    <div class="status-display" id="status-log">
                        等待任务执行...
                    </div>
                </div>
            </div>
        </div>

        <div class="code-example">
            <h3>当前执行的代码示例</h3>
            <div class="code-block" id="current-code">
                <span class="highlight">// 点击上方按钮查看对应的代码示例</span><br>
                console.log('欢迎使用事件循环可视化工具！');
            </div>
        </div>
    </div>

    <script src="event-loop-simulator.js"></script>
</body>
</html>
