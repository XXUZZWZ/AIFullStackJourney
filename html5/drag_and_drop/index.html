<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop</title>
</head>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: steelblue;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    margin: 0;
  }

  .empty {
    height: 150px;
    width: 150px;
    margin: 10px;
    border: 3px solid #000;
    background-color: #fff;
  }

  .fill {
    background-image: url('https://k.sinaimg.cn/n/sinakd20240324s/555/w640h715/20240324/0340-f065618631f1332c14d63f9d418734a0.jpg/w700d1q75cms.jpg');
    background-size: cover;
    width: 145px;
    height: 145px;
    cursor: pointer;
  }

  .hold {
    border: 5px solid #ccc;
  }

  /* 自适应 
     媒体(媒介)设备选择
     PC
     超大环绕屏
     IPAD
  */
  /* 设置在什么媒体上生效
     选择小尺寸 移动端
     如果大于则不生效
  */
  @media (max-width:800px) {
    body {
      flex-direction: column;
    }
  }

  .hovered {
    background-color: #333;
    border: 5px dotted rgb(45, 207, 80);
  }

  .invisible {
    display: none;
  }
</style>

<body>
  <div class="empty ">
    <!-- 可以拖拽 -->
    <div class="fill" draggable="true"></div>
  </div>
  <div class="empty "></div>
  <div class="empty"></div>
  <div class="empty"></div>
  <div class="empty"></div>
  <script>
    const fill = document.querySelector(".fill");
    const empties = document.querySelectorAll('.empty')
    const body = document.body;

    // 保持body监听器并增强事件捕获
    // body.addEventListener('dragstart', dragStart, true);
    // body.addEventListener('dragend', dragEnd, true);
    // body.addEventListener('dragover', dragOver, true);
    // body.addEventListener('drop', dragDrop, true);
    function dragStart(e) {
      if (!e.target.classList.contains('fill')) {
        e.preventDefault();
        // 阻止默认行为
        return;
      }
      fill.className += ' hold';
      setTimeout(() => fill.className = 'invisible')
    }

    function dragEnd(event) {

      fill.className = 'fill';
    }
    function dragOver(event) {
      event.preventDefault();
      console.log('dragOver')
      // event.preventDefault();
      // event.stopPropagation();
      // console.log('dragOver')
      // console.log(event.target)
    }
    function dragDrop(event) {
      // event.preventDefault();
      // event.stopPropagation();
      // event.target.appendChild(fill)
      this.append(fill);
    }
    function dragEnter(event) {
      // event.preventDefault();
      // event.stopPropagation();
      // event.target.classList.add('hovered');
      console.log('dragEnter')
      this.className += ' hovered';

      // this.append(fill);
    }
    function dragLeave(event) {
      // event.preventDefault();
      // event.stopPropagation();
      // event.target.classList.remove('hovered');
      this.className = 'empty';
    }
    for (const empty of empties) {
      empty.addEventListener('dragover', dragOver);
      empty.addEventListener('dragenter', dragEnter);
      empty.addEventListener('dragleave', dragLeave);
      empty.addEventListener('drop', dragDrop);
    }
  </script>
</body>

</html>
