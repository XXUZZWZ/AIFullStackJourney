<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>child-page</h1>
  <input type="text" class="inp">
  <button class="btn">发送</button>
  <div class="contents">
    <p>接受的消息</p>
    <ul class="message"></ul>
  </div>
  <script>
    window.addEventListener('message', (event) => {
      if (event.origin !== 'http://localhost:5502') {
        return;
      }
      document.querySelector('.message').innerHTML += `<li>${event.data}</li>`;
      console.log(event.data);
    })
  </script>
</body>

</html>
