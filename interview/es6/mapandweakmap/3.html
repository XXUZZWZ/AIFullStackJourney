<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gc</title>
</head>

<body>
  <div id="box"></div>
  <script>
    const box = document.getElementById('box');
    const map = new Map([
      [box, 'box'],
      [box, 'bbbboooox']
    ]);

    box.addEventListener('click', () => {
      map.set(box, 'box');
    });

    console.log(map.keys());
    console.log(map.values());
    for (let [k, v] of map.entries()) {
      console.log(k, '=>', v);
    }
  </script>
</body>

</html>
