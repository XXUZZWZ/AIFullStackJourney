<html>

<body>
  <h1 id="ct"></h1>
  <script>

    setInterval(
      () => {
        const d = new Date()
        const ct = document.getElementById('ct')
        ct.textContent = d.toLocaleTimeString()
        document.body.style.backgroundColor = `hsl(${d.getHours() % 16}, ${d.getMinutes() % 16}, ${d.getSeconds() % 16})`
      }, 1000
    )

  </script>
</body>

</html>
