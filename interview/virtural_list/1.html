<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="container"></div>
  <script>
    let now = Date.now();
    const total = 10000;
    let ul = document.createElement('ul');
    for (let i = 0; i < total; i++) {
      let li = document.createElement('li');
      li.innerText = `item ${i}`;
      ul.appendChild(li);
    }
    // js 同步代码---> 微任务队列-->页面渲染---> 宏任务队列
    document.getElementById('container').appendChild(ul);
    console.log(Date.now() - now, '同步代码')
    setTimeout(() => {
      console.log(Date.now() - now, '宏任务队列');
    }, 0)
    Promise.resolve().then(() => {
      console.log(Date.now() - now, '微任务队列');
    })
  </script>
</body>

</html>
