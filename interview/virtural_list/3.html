<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul id="container"></ul>
  <script>
    // setTimeout 会白一下，requestAnimationFrame requestAnimation 的步伐跟着系统的刷新步伐走，它能吧主回调函数在屏幕在每次刷新间隔中执行一次，不会丢帧了，不会不在一个频道上
    const start = Date.now();
    let ul = document.getElementById('container');
    let total = 10000;
    let once = 20;
    let page = total / once;
    let index = 0;
    function loop(curTotal, curIndex) {
      if (curTotal <= 0) {
        return false;
      }
      let pageCount = Math.min(curTotal, once);
      requestAnimationFrame(function () {
        for (let i = 0; i < pageCount; i++) {
          let li = document.createElement('li');
          li.innerText = curIndex + '第几个' + i + `还剩${curTotal - curIndex}`;
          ul.appendChild(li);
        }
        loop(curTotal - pageCount, pageCount);
      })
    }
    loop(total, index);
    setTimeout(() => {
      console.log(Date.now() - start, "endTime 宏任务")
    }, 0)

  </script>
</body>

</html>
