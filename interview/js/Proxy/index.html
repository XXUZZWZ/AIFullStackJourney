<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy</title>
</head>

<body>
  <div id="container">1</div>
  <button id="button" type="button">点击加1</button>
  <div>
    登录状态：<span id="login-status">未登录</span>
  </div>
  <button id='loginBtn'>登陆</button>
  <script>
    let data = {
      value: 1,
      isLogin: false
    };

    function updateView() {
      // document.getElementById('container').textContent = data.value;
      document.getElementById('login-status').textContent = data.isLogin ? '已登录' : '未登录';
    }
    // Proxy 代理对象 
    // 代理授权
    // 一次性代理整个对象
    // 对data 所有的属性进行代理
    const reactiveData = new Proxy(data, {
      // 代理的行为
      set(target, key, value, receiver) {
        // 修改原始数据
        target[key] = value;

        // 自动更新视图（这里可以更智能地做依赖收集）
        console.log(`属性 ${key} 被设置为:`, value);
        updateView();

        return true;
      },
      get(target, key, receiver) {
        console.log(`读取属性 ${key}:`, target[key]);
        return target[key];
      }
    });
    console.log(reactiveData);
    document.getElementById('button').addEventListener('click', function () {
      reactiveData.value += 1; // 触发 set，自动更新视图
    });
    document.getElementById('loginBtn').addEventListener('click', function () {
      reactiveData.isLogin = !reactiveData.isLogin; // 触发 set，自动更新视图
    });
  </script>
</body>

</html>
