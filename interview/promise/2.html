<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <script>
    // Promise 状态有三个 pending fullfilled rejected
    // pending -> fullfilled 或者 rejected 状态不可逆
    Promise.Myall = function (promises) {
      let arr = []; // 结果数组
      let count = 0; // 计数器
      return new Promise((resolve, reject) => {
        // resolve -> all promises 所有resolve 才能调用
        // 如果 promise[i] 不是promise 怎么办？ Promise.resolve(promise[i])
        promises.forEach((item, i) => {
          // 不是promise 就变成promise
          Promise.resolve(item)
            .then((res) => {
              arr[i] = res;
              count++;
              if (count === promises.length) {
                resolve(arr);
              }
            })
            .catch((err) => {
              reject(err);
            });
        });
      });
    };
  </script>
</body>

</html>
