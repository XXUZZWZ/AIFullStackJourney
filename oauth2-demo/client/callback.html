<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2回调处理</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .step {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            display: none;
        }

        .step.active {
            display: block;
            background: #f8f9fa;
            border-left: 4px solid #007bff;
        }

        .step.completed {
            display: block;
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .step.error {
            display: block;
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        .step h3 {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .step-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            color: white;
        }

        .step-icon.pending {
            background: #6c757d;
        }

        .step-icon.processing {
            background: #007bff;
            animation: pulse 1.5s infinite;
        }

        .step-icon.success {
            background: #28a745;
        }

        .step-icon.error {
            background: #dc3545;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .code-block {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            border: 1px solid #dee2e6;
        }

        .error-message {
            color: #721c24;
            background: #f8d7da;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔄 处理OAuth2回调</h2>
        <p id="callback-info">正在处理授权响应...</p>

        <div class="loader" id="loader"></div>

        <div id="step1" class="step active">
            <h3>
                <span class="step-icon processing">1</span>
                接收授权码
            </h3>
            <div id="auth-code-display"></div>
        </div>

        <div id="step2" class="step">
            <h3>
                <span class="step-icon pending">2</span>
                交换访问令牌
            </h3>
            <div id="token-exchange-display"></div>
        </div>

        <div id="step3" class="step">
            <h3>
                <span class="step-icon pending">3</span>
                获取用户信息
            </h3>
            <div id="userinfo-display"></div>
        </div>

        <div id="error-display" class="error-message" style="display: none;">
            <h3>❌ 错误</h3>
            <p id="error-message"></p>
            <a href="index.html" class="btn btn-secondary">返回首页</a>
        </div>

        <div id="success-actions" style="display: none; margin-top: 20px;">
            <a href="dashboard.html" class="btn btn-primary">查看用户信息</a>
            <a href="index.html" class="btn btn-secondary" style="margin-left: 10px;">返回首页</a>
        </div>
    </div>

    <script src="callback.js"></script>
</body>
</html>
